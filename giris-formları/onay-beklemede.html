
<!doctype html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Onay Beklemede | ŞAHİN UYMAZ</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
}

body{
    font-family:"Segoe UI",Arial,sans-serif;
    background:#061b33;
    color:#ffffff;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
}

.onay-kutu{
    width:100%;
    max-width:560px;
    margin:20px;
    background:#0b2948;
    border:1px solid rgba(255,255,255,.12);
    border-radius:18px;
    padding:45px 35px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.icon{
    width:80px;
    height:80px;
    margin:0 auto 25px;
    border-radius:50%;
    background:#eab308;
    color:#061b33;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    font-weight:800;
}

h1{
    margin:0 0 18px;
    font-size:30px;
    font-weight:800;
}

.aciklama{
    color:#cbd5e1;
    font-size:16px;
    line-height:1.8;
    margin:0 auto;
    max-width:450px;
}

.bilgi{
    margin-top:28px;
    padding:18px;
    border-radius:10px;
    background:rgba(255,255,255,.06);
    border-left:3px solid #168cff;
    color:#dbeafe;
    font-size:14px;
    line-height:1.7;
}

.durum{
    margin-top:25px;
    color:#86efac;
    font-size:14px;
    font-weight:700;
}

.anasayfa{
    display:inline-block;
    margin-top:30px;
    padding:12px 24px;
    border-radius:7px;
    background:#eab308;
    color:#061b33;
    text-decoration:none;
    font-weight:800;
    transition:.25s;
}

.anasayfa:hover{
    background:#facc15;
    transform:translateY(-2px);
}

.alt-yazi{
    margin-top:28px;
    color:#94a3b8;
    font-size:12px;
}

.sahin{
    color:#168cff;
}

.uymaz{
    color:#ffffff;
}


/* MOBİL */

@media(max-width:600px){

    .onay-kutu{
        margin:15px;
        padding:35px 22px;
    }

    h1{
        font-size:25px;
    }

    .aciklama{
        font-size:15px;
    }

}

</head>

<body>

<div class="onay-kutu">

    <div class="icon">
        ✓
    </div>

    <div class="isim">
        <span class="sahin">ŞAHİN</span>
        <span class="uymaz"> UYMAZ</span>
    </div>

    <h1>Onay Beklemede</h1>

    <p class="aciklama">
        Bilgileriniz başarıyla alınmıştır.
        Telefon doğrulamanız tamamlanmıştır.
    </p>

    <div class="bilgi">
        <strong>Asistan onayı için bilgileriniz alınmıştır.</strong><br><br>

        Site giriş talebiniz değerlendirmeye alınmıştır.
        Gerekli kontroller tamamlandıktan sonra
        tarafınıza site giriş onayı hakkında bilgi verilecektir.
    </div>

    <div class="durum">
        ● Giriş talebiniz değerlendirme aşamasında
    </div>

    <a href="index.html" class="anasayfa">
        Ana Sayfaya Dön
    </a>

    <div class="alt-yazi">
        Kamu Politikaları • Kamu Hizmetleri<br>
        Araştırma • İzleme • Değerlendirme
    </div>

</div>

</body>
</html>
