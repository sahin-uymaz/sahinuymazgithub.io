<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Haber Detayı | Şahin UYMAZ</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-50 text-slate-900">
<header class="bg-slate-950 text-white"><div class="max-w-4xl mx-auto px-4 py-5"><a href="gundem.html" class="font-black">← Gündem</a></div></header>
<main class="max-w-4xl mx-auto px-4 py-8"><article id="article" class="bg-white rounded-3xl overflow-hidden shadow-sm"></article></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getFirestore,doc,getDoc} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";
const db=getFirestore(initializeApp(firebaseConfig));
const id=new URLSearchParams(location.search).get("id"), box=document.getElementById("article");
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
if(!id){box.innerHTML="<div class='p-8'>Haber bulunamadı.</div>";}
else {const s=await getDoc(doc(db,"gundem_haberleri",id)); if(!s.exists()||s.data().published!==true){box.innerHTML="<div class='p-8'>Haber bulunamadı.</div>";} else {const x=s.data(); document.title=x.title+" | Şahin UYMAZ"; box.innerHTML=`<img src="${esc(x.imageUrl||'')}" class="w-full max-h-[560px] object-cover" alt=""><div class="p-6 md:p-10"><div class="text-sm font-bold text-blue-600">${esc(x.category||"Gündem")}</div><h1 class="text-3xl md:text-5xl font-black mt-2">${esc(x.title)}</h1><p class="text-slate-500 mt-3">${x.publishedAt?.toDate?x.publishedAt.toDate().toLocaleString("tr-TR"):""}</p><div class="mt-8 text-lg leading-8 whitespace-pre-line">${esc(x.content||"")}</div></div>`}}
</script></body></html>
