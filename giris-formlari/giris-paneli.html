<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Giriş Paneli</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #1e40af;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      transition: opacity 0.5s ease;
    }
    #loginContainer { display: none; }
    #loginContainer.visible { display: block; }
    #successBox { display: none; text-align: center; color: green; }
  </style>
</head>
<body>

<!-- Yükleme ekranı -->
<div id="loading-screen">Yükleniyor...</div>

<!-- Giriş paneli -->
<div id="loginContainer">
  <form id="loginForm">
    <div id="formContainer">
      <input id="accessCode" type="text" placeholder="6 haneli giriş kodu">
      <button type="submit" onclick="handleUserLogin(event)">GİRİŞ</button>
    </div>
    <div id="successBox">Giriş başarılı!</div>
  </form>
</div>

<script>
  document.addEventListener("DOMContentLoaded", function() {
    const loadingScreen = document.getElementById("loading-screen");
    const loginContainer = document.getElementById("loginContainer");

    setTimeout(function() {
      loadingScreen.style.opacity = "0";
      loadingScreen.style.visibility = "hidden";
      loginContainer.classList.add("visible");
    }, 2000);
  });

  const loginForm = document.getElementById("loginForm");
  const formContainer = document.getElementById("formContainer");
  const successBox = document.getElementById("successBox");

  loginForm.addEventListener("submit", function(event) {
    event.preventDefault();
    formContainer.style.display = "none";
    successBox.style.display = "block";
  });

  function handleUserLogin(event) {
    event.preventDefault();
    const code = document.getElementById("accessCode").value;

    if (code.length === 6) {
      alert("Giriş başarılı! Ana sayfaya yönlendiriliyorsunuz...");
      window.location.href = "index.html"; 
    } else {
      alert("Lütfen 6 haneli kodunuzu eksiksiz giriniz.");
    }
  }
</script>

</body>
</html>
