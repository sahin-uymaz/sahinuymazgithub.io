<!DOCTYPE html>
<html lang="tr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gündem Yönetim Paneli</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 text-slate-900">
<header class="bg-slate-950 text-white"><div class="max-w-6xl mx-auto px-4 py-5 flex justify-between"><b>GÜNDEM YÖNETİM PANELİ</b><button id="logout" class="hidden bg-white/10 px-3 py-2 rounded">Çıkış</button></div></header>
<main class="max-w-6xl mx-auto px-4 py-8">
<section id="login" class="max-w-md mx-auto bg-white p-7 rounded-2xl shadow"><h1 class="text-2xl font-black mb-5">Admin Girişi</h1><input id="email" class="w-full border p-3 rounded mb-3" placeholder="E-posta"><input id="password" type="password" class="w-full border p-3 rounded mb-3" placeholder="Şifre"><button id="loginBtn" class="w-full bg-blue-600 text-white p-3 rounded font-bold">Giriş Yap</button><p id="msg" class="text-red-600 text-sm mt-3"></p></section>
<section id="panel" class="hidden">
<div class="grid lg:grid-cols-3 gap-6">
<div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow">
<h2 class="text-xl font-black mb-4">Yeni Haber / Düzenle</h2>
<input id="title" class="w-full border p-3 rounded mb-3" placeholder="Haber başlığı">
<div class="grid md:grid-cols-2 gap-3"><select id="category" class="border p-3 rounded"><option>Siyaset</option><option>Ekonomi</option><option>Gündem</option><option>Spor</option><option>Dünya</option><option>Teknoloji</option><option>Kültür & Sanat</option></select><input id="date" type="datetime-local" class="border p-3 rounded"></div>
<textarea id="summary" class="w-full border p-3 rounded mt-3 h-24" placeholder="Kısa özet"></textarea>
<textarea id="content" class="w-full border p-3 rounded mt-3 h-72" placeholder="Haberin tüm detayları"></textarea>
<input id="image" type="file" accept="image/*" class="w-full border p-3 rounded mt-3">
<div class="flex flex-wrap gap-4 mt-4"><label><input id="published" type="checkbox" checked> Yayında</label><label><input id="slider" type="checkbox"> Slider'da göster</label></div>
<div class="flex gap-3 mt-5"><button id="save" class="bg-blue-600 text-white px-5 py-3 rounded-xl font-bold">Yayınla / Kaydet</button><button id="clear" class="bg-slate-200 px-5 py-3 rounded-xl">Temizle</button></div>
<p id="status" class="mt-3 text-sm"></p>
</div>
<div class="bg-white p-6 rounded-2xl shadow"><h2 class="text-xl font-black mb-4">Haberler</h2><div id="list" class="space-y-3"></div></div>
</div></section></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
import {getFirestore,collection,getDocs,doc,setDoc,addDoc,deleteDoc,serverTimestamp,query,orderBy} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import {getStorage,ref,uploadBytes,getDownloadURL} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-storage.js";
import {firebaseConfig} from "./firebase-config.js";
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),storage=getStorage(app);
const $=id=>document.getElementById(id); let editingId=null, currentImage="";
$("loginBtn").onclick=async()=>{try{await signInWithEmailAndPassword(auth,$("email").value,$("password").value);$("msg").textContent=""}catch(e){$("msg").textContent="Giriş başarısız: "+e.message}};
$("logout").onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{if(u){$("login").classList.add("hidden");$("panel").classList.remove("hidden");$("logout").classList.remove("hidden");load()}else{$("login").classList.remove("hidden");$("panel").classList.add("hidden");$("logout").classList.add("hidden")}});
async function load(){const s=await getDocs(query(collection(db,"gundem_haberleri"),orderBy("publishedAt","desc")));$("list").innerHTML=s.docs.map(d=>{const x=d.data();return `<div class="border rounded-xl p-3"><b>${esc(x.title)}</b><div class="text-xs text-slate-500 mt-1">${esc(x.category||"")} · ${x.published?"Yayında":"Taslak"}</div><div class="flex gap-2 mt-2"><button data-edit="${d.id}" class="text-blue-700 text-sm font-bold">Düzenle</button><button data-del="${d.id}" class="text-red-600 text-sm font-bold">Sil</button></div></div>`}).join("");document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>edit(b.dataset.edit));document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>remove(b.dataset.del))}
async function edit(id){const s=await getDocs(query(collection(db,"gundem_haberleri")));const d=s.docs.find(x=>x.id===id);if(!d)return;const x=d.data();editingId=id;currentImage=x.imageUrl||"";$("title").value=x.title||"";$("category").value=x.category||"Gündem";$("summary").value=x.summary||"";$("content").value=x.content||"";$("published").checked=!!x.published;$("slider").checked=!!x.slider;window.scrollTo({top:0,behavior:"smooth"})}
async function remove(id){if(!confirm("Bu haber silinsin mi?"))return;await deleteDoc(doc(db,"gundem_haberleri",id));load()}
$("clear").onclick=()=>{editingId=null;currentImage="";["title","summary","content","image"].forEach(i=>$(i).value="");$("published").checked=true;$("slider").checked=false};
$("save").onclick=async()=>{
if(!auth.currentUser)return; const title=$("title").value.trim(); if(!title){$("status").textContent="Başlık zorunlu.";return}
$("status").textContent="Kaydediliyor...";
try{
 let imageUrl=currentImage, f=$("image").files[0];
 if(f){const r=ref(storage,"gundem/"+Date.now()+"-"+f.name.replace(/[^a-zA-Z0-9._-]/g,"_"));await uploadBytes(r,f);imageUrl=await getDownloadURL(r)}
 const data={title,category:$("category").value,summary:$("summary").value.trim(),content:$("content").value.trim(),imageUrl,published:$("published").checked,slider:$("slider").checked,publishedAt:serverTimestamp(),updatedAt:serverTimestamp()};
 if(editingId) await setDoc(doc(db,"gundem_haberleri",editingId),data,{merge:true}); else await addDoc(collection(db,"gundem_haberleri"),data);
 $("status").textContent="Haber başarıyla kaydedildi."; $("clear").click(); load();
}catch(e){$("status").textContent="Hata: "+e.message;console.error(e)}
};
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
</script></body></html>
