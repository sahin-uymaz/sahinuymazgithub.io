<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gündem | Şahin UYMAZ</title>
<meta name="description" content="Güncel gündem, siyaset, ekonomi, spor ve diğer haberler.">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#f5f7fb;color:#172033}
.hero{min-height:430px}.line-clamp-2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card{transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 15px 35px rgba(0,0,0,.10)}
</style>
</head>
<body>
<header class="bg-slate-950 text-white sticky top-0 z-50 shadow">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
    <a href="gundem.html" class="font-black text-xl">ŞAHİN UYMAZ</a>
    <nav class="flex gap-2 overflow-x-auto text-sm">
      <a class="px-3 py-2 rounded-lg bg-white/10" href="gundem.html">Gündem</a>
      <span id="categories"></span>
    </nav>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-6">
  <section id="slider" class="hero rounded-3xl overflow-hidden bg-slate-900 text-white relative mb-10"></section>
  <div class="flex items-end justify-between mb-5">
    <div><p class="text-blue-600 font-bold text-sm">GÜNCEL</p><h1 class="text-3xl md:text-4xl font-black">Gündem</h1></div>
  </div>
  <div id="sections"></div>
</main>

<footer class="bg-slate-950 text-white mt-14">
  <div class="max-w-7xl mx-auto px-4 py-8 text-sm text-white/70">© <span id="year"></span> Şahin UYMAZ — Gündem</div>
</footer>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
import {getFirestore,collection,getDocs,query,where,orderBy} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";
import {firebaseConfig} from "./firebase-config.js";

const app=initializeApp(firebaseConfig), db=getFirestore(app);
const $=id=>document.getElementById(id);
$("year").textContent=new Date().getFullYear();

async function load(){
  const snap=await getDocs(query(collection(db,"gundem_haberleri"),where("published","==",true),orderBy("publishedAt","desc")));
  const news=snap.docs.map(d=>({id:d.id,...d.data()}));
  const sliderNews=news.filter(x=>x.slider).slice(0,8);
  renderSlider(sliderNews.length?sliderNews:news.slice(0,5));
  const cats=[...new Set(news.map(x=>x.category).filter(Boolean))];
  $("categories").innerHTML=cats.map(c=>`<a class="px-3 py-2 whitespace-nowrap" href="#${slug(c)}">${esc(c)}</a>`).join("");
  $("sections").innerHTML=cats.map(c=>{
    const items=news.filter(x=>x.category===c).slice(0,6);
    return `<section id="${slug(c)}" class="mb-12"><div class="flex items-center justify-between mb-4"><h2 class="text-2xl font-black">${esc(c)}</h2><span class="text-sm text-slate-500">${items.length} haber</span></div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">${items.map(card).join("")}</div></section>`;
  }).join("");
}
function renderSlider(items){
  $("slider").innerHTML=`<div class="grid md:grid-cols-2 h-full">${items.map((x,i)=>`<article class="${i===0?'block':'hidden'} slider-item relative h-[430px]" data-i="${i}">
    <img src="${esc(x.imageUrl||'')}" class="absolute inset-0 w-full h-full object-cover" alt="">
    <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/25 to-transparent"></div>
    <div class="absolute bottom-0 left-0 right-0 p-7"><span class="bg-blue-600 px-3 py-1 rounded-full text-xs font-bold">${esc(x.category||'Gündem')}</span><h2 class="text-2xl md:text-4xl font-black mt-3">${esc(x.title)}</h2><p class="text-white/80 mt-2 max-w-2xl">${esc(x.summary||'')}</p><a href="haber-detay.html?id=${encodeURIComponent(x.id)}" class="inline-block mt-5 bg-white text-slate-950 px-5 py-3 rounded-xl font-bold">Haberi Oku</a></div>
  </article>`).join("")}</div>
  ${items.length>1?`<div class="absolute bottom-5 right-5 flex gap-2">${items.map((_,i)=>`<button class="dot w-3 h-3 rounded-full bg-white/50" data-i="${i}"></button>`).join("")}</div>`:''}`;
  let i=0; if(items.length>1){setInterval(()=>{const a=document.querySelectorAll(".slider-item");a.forEach(e=>e.classList.add("hidden"));i=(i+1)%a.length;a[i].classList.remove("hidden")},5000)}
}
function card(x){return `<article class="card bg-white rounded-2xl overflow-hidden border border-slate-100"><img src="${esc(x.imageUrl||'')}" class="w-full h-52 object-cover" alt=""><div class="p-5"><div class="text-xs font-bold text-blue-600">${esc(x.category||'Gündem')} · ${date(x.publishedAt)}</div><h3 class="font-black text-xl mt-2 line-clamp-2">${esc(x.title)}</h3><p class="text-slate-600 mt-2 line-clamp-2">${esc(x.summary||'')}</p><a class="inline-block mt-4 text-blue-700 font-bold" href="haber-detay.html?id=${encodeURIComponent(x.id)}">Devamını Oku →</a></div></article>`}
function slug(s){return s.toLocaleLowerCase("tr-TR").replaceAll("ı","i").replaceAll("ğ","g").replaceAll("ü","u").replaceAll("ş","s").replaceAll("ö","o").replaceAll("ç","c").replace(/[^a-z0-9]+/g,"-")}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function date(v){try{return v?.toDate?v.toDate().toLocaleDateString("tr-TR"):new Date(v).toLocaleDateString("tr-TR")}catch{return ""}}
load().catch(e=>{$("sections").innerHTML='<div class="bg-white p-6 rounded-2xl">Gündem verileri yüklenemedi. Firebase yapılandırmasını kontrol edin.</div>';console.error(e)});
</script>
</body>
</html>
