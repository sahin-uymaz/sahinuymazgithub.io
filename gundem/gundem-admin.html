<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gündem Admin Paneli</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --border-color: #334155;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --danger: #ef4444;
            --success: #22c55e;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.5rem;
            color: var(--primary);
        }

        .category-nav {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .category-nav-btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .category-nav-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .stat-card p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .category-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .category-header {
            padding: 15px 20px;
            background-color: #1a2332;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .category-header h2 {
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .news-form-container {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: none;
            background-color: #141e30;
        }

        .news-form-container.open {
            display: block;
        }

        .form-fields {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field label {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        .field input[type="text"],
        .field input[type="date"],
        .field input[type="url"],
        .field textarea {
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 10px;
            border-radius: 6px;
            outline: none;
        }

        .field textarea {
            height: 80px;
            resize: vertical;
        }

        .field textarea.content {
            height: 150px;
        }

        .two-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .image-upload-box {
            border: 2px dashed var(--border-color);
            padding: 20px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            background-color: var(--bg-color);
        }

        .image-preview {
            max-width: 100%;
            max-height: 200px;
            margin-top: 10px;
            border-radius: 6px;
            display: none;
        }

        .options {
            display: flex;
            gap: 20px;
        }

        .option {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }

        .news-list {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .news-item {
            display: flex;
            gap: 15px;
            background-color: var(--bg-color);
            padding: 15px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            align-items: center;
        }

        .news-image {
            width: 100px;
            height: 70px;
            border-radius: 4px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .news-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .news-details {
            flex-grow: 1;
        }

        .news-details h3 {
            font-size: 1.05rem;
            margin-bottom: 5px;
        }

        .news-details p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .news-meta {
            display: flex;
            gap: 8px;
            align-items: center;
            margin-bottom: 5px;
        }

        .badge {
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
        }

        .badge-category { background-color: var(--primary); }
        .badge-published { background-color: var(--success); }
        .badge-draft { background-color: var(--text-muted); }
        .badge-slider { background-color: var(--warning); color: #000; }
        .badge-breaking { background-color: var(--danger); }

        .news-actions {
            display: flex;
            gap: 8px;
        }

        .action-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-size: 0.85rem;
        }

        .action-btn.view { background-color: #64748b; }
        .action-btn.edit { background-color: var(--primary); }
        .action-btn.delete { background-color: var(--danger); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 90%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
            margin-bottom: 15px;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .read-modal-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 15px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: var(--success);
            color: white;
            padding: 12px 20px;
            border-radius: 6px;
            display: none;
            z-index: 2000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .toast.error {
            background-color: var(--danger);
        }

        .toast.show {
            display: block;
        }
    </style>
</head>
<body>

<div class="admin-container">
    <header>
        <h1><i class="fa-solid fa-newspaper"></i> Haber Yönetim Paneli</h1>
    </header>

    <!-- KATEGORİ HIZLI ERİŞİM MENÜSÜ -->
    <div class="category-nav">
        <button class="category-nav-btn" onclick="scrollToCategory('gundem')"><i class="fa-solid fa-layer-group"></i> Gündem</button>
        <button class="category-nav-btn" onclick="scrollToCategory('ekonomi')"><i class="fa-solid fa-chart-line"></i> Ekonomi</button>
        <button class="category-nav-btn" onclick="scrollToCategory('siyaset')"><i class="fa-solid fa-building-columns"></i> Siyaset</button>
        <button class="category-nav-btn" onclick="scrollToCategory('spor')"><i class="fa-solid fa-football"></i> Spor</button>
        <button class="category-nav-btn" onclick="scrollToCategory('teknoloji')"><i class="fa-solid fa-microchip"></i> Teknoloji</button>
    </div>

    <!-- İSTATİSTİK KARTLARI -->
    <div class="stats-grid">
        <div class="stat-card">
            <h3 id="totalNews">0</h3>
            <p>Toplam Haber</p>
        </div>
        <div class="stat-card">
            <h3 id="publishedNews">0</h3>
            <p>Yayında</p>
        </div>
        <div class="stat-card">
            <h3 id="sliderNews">0</h3>
            <p>Manşet (Slider)</p>
        </div>
        <div class="stat-card">
            <h3 id="breakingNews">0</h3>
            <p>Son Dakika</p>
        </div>
    </div>

    <!-- 1. GÜNDEM KATEGORİSİ -->
    <div class="category-section" id="category-gundem">
        <div class="category-header">
            <h2><i class="fa-solid fa-layer-group" style="color: #3b82f6;"></i> Gündem Haberleri</h2>
            <button class="btn" onclick="toggleForm('gundem')"><i class="fa-solid fa-plus"></i> Yeni Haber Ekle</button>
        </div>
        <div class="news-form-container" id="form-gundem"></div>
        <div class="news-list" id="list-gundem"></div>
    </div>

    <!-- 2. EKONOMİ KATEGORİSİ -->
    <div class="category-section" id="category-ekonomi">
        <div class="category-header">
            <h2><i class="fa-solid fa-chart-line" style="color: #10b981;"></i> Ekonomi Haberleri</h2>
            <button class="btn" onclick="toggleForm('ekonomi')"><i class="fa-solid fa-plus"></i> Yeni Haber Ekle</button>
        </div>
        <div class="news-form-container" id="form-ekonomi"></div>
        <div class="news-list" id="list-ekonomi"></div>
    </div>

    <!-- 3. SİYASET KATEGORİSİ -->
    <div class="category-section" id="category-siyaset">
        <div class="category-header">
            <h2><i class="fa-solid fa-building-columns" style="color: #f59e0b;"></i> Siyaset Haberleri</h2>
            <button class="btn" onclick="toggleForm('siyaset')"><i class="fa-solid fa-plus"></i> Yeni Haber Ekle</button>
        </div>
        <div class="news-form-container" id="form-siyaset"></div>
        <div class="news-list" id="list-siyaset"></div>
    </div>

    <!-- 4. SPOR KATEGORİSİ -->
    <div class="category-section" id="category-spor">
        <div class="category-header">
            <h2><i class="fa-solid fa-football" style="color: #ef4444;"></i> Spor Haberleri</h2>
            <button class="btn" onclick="toggleForm('spor')"><i class="fa-solid fa-plus"></i> Yeni Haber Ekle</button>
        </div>
        <div class="news-form-container" id="form-spor"></div>
        <div class="news-list" id="list-spor"></div>
    </div>

    <!-- 5. TEKNOLOJİ KATEGORİSİ -->
    <div class="category-section" id="category-teknoloji">
        <div class="category-header">
            <h2><i class="fa-solid fa-microchip" style="color: #8b5cf6;"></i> Teknoloji Haberleri</h2>
            <button class="btn" onclick="toggleForm('teknoloji')"><i class="fa-solid fa-plus"></i> Yeni Haber Ekle</button>
        </div>
        <div class="news-form-container" id="form-teknoloji"></div>
        <div class="news-list" id="list-teknoloji"></div>
    </div>
</div>

<!-- MODAL (OKUMA / DÜZENLEME) -->
<div class="modal-overlay" id="appModal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 id="modalTitle">Haber</h2>
            <button class="close-modal" onclick="closeModal()">&times;</button>
        </div>
        <div id="modalBody"></div>
    </div>
</div>

<div class="toast" id="toast">İşlem Başarılı</div>

<script>
const STORAGE_KEY = "gundem_news_data";
let news = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
let imageStore = {};

const categories = {
    gundem: { label: "GÜNDEM", title: "Gündem Haberleri" },
    ekonomi: { label: "EKONOMİ", title: "Ekonomi Haberleri" },
    siyaset: { label: "SİYASET", title: "Siyaset Haberleri" },
    spor: { label: "SPOR", title: "Spor Haberleri" },
    teknoloji: { label: "TEKNOLOJİ", title: "Teknoloji Haberleri" }
};

document.addEventListener("DOMContentLoaded", () => {
    buildForms();
    renderAllNews();
    updateStats();
});

// Her kategori için dinamik form oluşturur
function buildForms() {
    const today = new Date().toISOString().split('T')[0];
    Object.keys(categories).forEach(cat => {
        const container = document.getElementById(`form-${cat}`);
        if(!container) return;

        container.innerHTML = `
            <div class="form-fields">
                <div class="field">
                    <label>HABER BAŞLIĞI</label>
                    <input type="text" id="title-${cat}" placeholder="Başlık yazın...">
                </div>
                
                <div class="field">
                    <label>HABER GÖRSELİ (BİLGİSAYARDAN VEYA LİNK OLARAK)</label>
                    <div class="image-upload-box" onclick="document.getElementById('file-${cat}').click()">
                        <i class="fa-solid fa-cloud-arrow-up fa-2x"></i>
                        <p style="margin-top: 5px;">Bilgisayardan Resim Seçin</p>
                        <input type="file" id="file-${cat}" accept="image/*" style="display:none;" onchange="handleImageUpload(event, '${cat}')">
                        <img id="preview-${cat}" class="image-preview" src="">
                    </div>
                    <input type="url" id="imageUrl-${cat}" placeholder="VEYA Görsel İnternet Adresi (URL) Yapıştırın (https://...)" style="margin-top: 8px;">
                </div>

                <div class="field">
                    <label>KISA AÇIKLAMA / SPOT</label>
                    <textarea id="summary-${cat}" placeholder="Haberin özetini yazın..."></textarea>
                </div>

                <div class="field">
                    <label>HABER DETAY METNİ</label>
                    <textarea class="content" id="content-${cat}" placeholder="Haberin detaylarını buraya yazın..."></textarea>
                </div>

                <div class="two-fields">
                    <div class="field">
                        <label>HABER TARİHİ</label>
                        <input type="date" id="date-${cat}" value="${today}">
                    </div>
                    <div class="field">
                        <label>KAYNAK</label>
                        <input type="text" id="source-${cat}" placeholder="Şahin UYMAZ">
                    </div>
                </div>

                <div class="field">
                    <label>YAYIN ÖZELLİKLERİ</label>
                    <div class="options">
                        <div class="option">
                            <input type="checkbox" id="published-${cat}" checked>
                            <label for="published-${cat}"><i class="fa-solid fa-globe"></i> Yayında</label>
                        </div>
                        <div class="option">
                            <input type="checkbox" id="slider-${cat}">
                            <label for="slider-${cat}"><i class="fa-solid fa-images"></i> Slider'a Ekle</label>
                        </div>
                        <div class="option">
                            <input type="checkbox" id="breaking-${cat}">
                            <label for="breaking-${cat}"><i class="fa-solid fa-bolt"></i> Son Dakika</label>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 10px;">
                    <button class="btn" onclick="saveNews('${cat}')">Haberi Kaydet</button>
                    <button class="btn" style="background-color: var(--border-color);" onclick="toggleForm('${cat}')">İptal</button>
                </div>
            </div>
        `;
    });
}

/* =========================================================
   GÖRSEL YÜKLEME VE OTOMATİK SIKIŞTIRMA (CANVAS)
========================================================= */
function handleImageUpload(event, category) {
    const file = event.target.files[0];
    if (file) {
        compressAndProcessImage(file, category);
    }
}

function compressAndProcessImage(file, category) {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = function (e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = function () {
            const canvas = document.createElement("canvas");
            const MAX_WIDTH = 800; // Maksimum 800px genişlik
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
                height = Math.round((height * MAX_WIDTH) / width);
                width = MAX_WIDTH;
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            // Resim boyutunu hafızada yer kaplamaması için ~50 KB seviyesine indirir
            const compressedBase64 = canvas.toDataURL("image/jpeg", 0.7);
            imageStore[category] = compressedBase64;
            
            const previewEl = document.getElementById(`preview-${category}`);
            if(previewEl) {
                previewEl.src = compressedBase64;
                previewEl.style.display = "block";
            }
            showToast("Resim optimize edilerek yüklendi.");
        };
    };
}

/* =========================================================
   KAYDETME, LİSTELEME VE SİLME
========================================================= */
function toggleForm(category) {
    const form = document.getElementById(`form-${category}`);
    if(form) form.classList.toggle("open");
}

function saveNews(category) {
    const title = document.getElementById(`title-${category}`).value.trim();
    const summary = document.getElementById(`summary-${category}`).value.trim();
    const content = document.getElementById(`content-${category}`).value.trim();
    const date = document.getElementById(`date-${category}`).value;
    const source = document.getElementById(`source-${category}`).value.trim() || "Şahin UYMAZ";
    
    const urlInput = document.getElementById(`imageUrl-${category}`);
    const externalImageUrl = urlInput ? urlInput.value.trim() : "";

    const isPublished = document.getElementById(`published-${category}`).checked;
    const isSlider = document.getElementById(`slider-${category}`).checked;
    const isBreaking = document.getElementById(`breaking-${category}`).checked;

    if (!title || !summary) {
        showToast("Lütfen Haber Başlığı ve Kısa Açıklamayı doldurun!", "error");
        return;
    }

    const finalImage = externalImageUrl || imageStore[category] || "https://images.unsplash.com/photo-1585829365295-ab7cd400c167?w=800";

    const newArticle = {
        id: Date.now().toString(),
        category: category,
        title: title,
        summary: summary,
        content: content || summary,
        date: date,
        source: source,
        image: finalImage,
        isPublished: isPublished,
        isSlider: isSlider,
        isBreaking: isBreaking,
        createdDate: new Date().toISOString()
    };

    news.unshift(newArticle);
    
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(news));
        showToast("Haber başarıyla eklendi ve yayınlandı!");
        clearForm(category);
        toggleForm(category);
        renderAllNews();
        updateStats();
    } catch (e) {
        showToast("Depolama alanı dolu! Görsel URL'si kullanarak haber ekleyin.", "error");
        news.shift();
    }
}

function clearForm(category) {
    document.getElementById(`title-${category}`).value = "";
    document.getElementById(`summary-${category}`).value = "";
    document.getElementById(`content-${category}`).value = "";
    document.getElementById(`source-${category}`).value = "";
    
    const urlInput = document.getElementById(`imageUrl-${category}`);
    if(urlInput) urlInput.value = "";
    
    removeImage(category);
}

function removeImage(category) {
    delete imageStore[category];
    const previewEl = document.getElementById(`preview-${category}`);
    if(previewEl) {
        previewEl.src = "";
        previewEl.style.display = "none";
    }
}

function deleteNews(id) {
    if(confirm("Bu haberi silmek istediğinizden emin misiniz?")) {
        news = news.filter(item => item.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(news));
        showToast("Haber sistemden silindi.");
        renderAllNews();
        updateStats();
    }
}

function renderAllNews() {
    Object.keys(categories).forEach(cat => {
        const listEl = document.getElementById(`list-${cat}`);
        if(!listEl) return;

        const catNews = news.filter(item => item.category === cat);

        if (catNews.length === 0) {
            listEl.innerHTML = `
                <div style="text-align: center; color: var(--text-muted); padding: 20px;">
                    <i class="fa-solid fa-folder-open" style="font-size: 2rem; margin-bottom: 10px; display: block;"></i>
                    Bu kategoride henüz eklenmiş haber bulunmuyor.
                </div>
            `;
            return;
        }

        listEl.innerHTML = catNews.map(item => `
            <div class="news-item">
                <div class="news-image">
                    <img src="${item.image}" alt="${item.title}">
                </div>
                <div class="news-details">
                    <div class="news-meta">
                        <span class="badge badge-category">${categories[item.category] ? categories[item.category].label : item.category}</span>
                        ${item.isPublished ? '<span class="badge badge-published">YAYINDA</span>' : '<span class="badge badge-draft">TASLAK</span>'}
                        ${item.isSlider ? '<span class="badge badge-slider">SLIDER</span>' : ''}
                        ${item.isBreaking ? '<span class="badge badge-breaking">SON DAKİKA</span>' : ''}
                    </div>
                    <h3>${item.title}</h3>
                    <p>${item.summary}</p>
                    <div style="font-size: 0.75rem; color: var(--text-muted);"><i class="fa-regular fa-calendar"></i> ${item.date} | Kaynak: ${item.source}</div>
                </div>
                <div class="news-actions">
                    <button class="action-btn view" onclick="openReadModal('${item.id}')">
                        <i class="fa-solid fa-eye"></i> Oku
                    </button>
                    <button class="action-btn edit" onclick="openEditModal('${item.id}')">
                        <i class="fa-solid fa-pen-to-square"></i> Düzenle
                    </button>
                    <button class="action-btn delete" onclick="deleteNews('${item.id}')">
                        <i class="fa-solid fa-trash"></i> Sil
                    </button>
                </div>
            </div>
        `).join('');
    });
}

function updateStats() {
    if(document.getElementById("totalNews")) document.getElementById("totalNews").textContent = news.length;
    if(document.getElementById("publishedNews")) document.getElementById("publishedNews").textContent = news.filter(n => n.isPublished).length;
    if(document.getElementById("sliderNews")) document.getElementById("sliderNews").textContent = news.filter(n => n.isSlider).length;
    if(document.getElementById("breakingNews")) document.getElementById("breakingNews").textContent = news.filter(n => n.isBreaking).length;
}

function scrollToCategory(catId) {
    const el = document.getElementById(`category-${catId}`);
    if(el) el.scrollIntoView({ behavior: 'smooth' });
}

/* =========================================================
   MODAL İŞLEMLERİ
========================================================= */
function openReadModal(id) {
    const item = news.find(n => n.id === id);
    if (!item) return;

    document.getElementById("modalTitle").textContent = "Haber Detayı";
    const body = document.getElementById("modalBody");

    body.innerHTML = `
        <img src="${item.image}" class="read-modal-img" alt="${item.title}">
        <div style="margin-bottom: 10px; font-size: 0.85rem; color: var(--text-muted);">
            <span><i class="fa-regular fa-calendar"></i> ${item.date}</span> | 
            <span><i class="fa-solid fa-user"></i> Kaynak: ${item.source}</span>
        </div>
        <h2 style="margin-bottom: 10px;">${item.title}</h2>
        <div style="font-weight: bold; margin-bottom: 15px; color: #cbd5e1;">${item.summary}</div>
        <div style="line-height: 1.6;">${item.content || item.summary}</div>
    `;

    document.getElementById("appModal").classList.add("show");
}

function openEditModal(id) {
    const item = news.find(n => n.id === id);
    if (!item) return;

    document.getElementById("modalTitle").textContent = "Haberi Düzenle";
    const body = document.getElementById("modalBody");

    body.innerHTML = `
        <div class="form-fields">
            <div class="field">
                <label>HABER BAŞLIĞI</label>
                <input type="text" id="edit-title" value="${item.title}">
            </div>

            <div class="field">
                <label>GÖRSEL URL (LİNK VEYA BASE64)</label>
                <input type="text" id="edit-image" value="${item.image}">
            </div>

            <div class="field">
                <label>KISA AÇIKLAMA / SPOT</label>
                <textarea id="edit-summary">${item.summary}</textarea>
            </div>

            <div class="field">
                <label>HABER DETAY METNİ</label>
                <textarea class="content" id="edit-content">${item.content || ''}</textarea>
            </div>

            <div class="two-fields">
                <div class="field">
                    <label>HABER TARİHİ</label>
                    <input type="date" id="edit-date" value="${item.date}">
                </div>
                <div class="field">
                    <label>KAYNAK</label>
                    <input type="text" id="edit-source" value="${item.source}">
                </div>
            </div>

            <div class="field">
                <label>YAYIN ÖZELLİKLERİ</label>
                <div class="options">
                    <div class="option">
                        <input type="checkbox" id="edit-published" ${item.isPublished ? 'checked' : ''}>
                        <label for="edit-published"><i class="fa-solid fa-globe"></i> Yayında</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="edit-slider" ${item.isSlider ? 'checked' : ''}>
                        <label for="edit-slider"><i class="fa-solid fa-images"></i> Slider'a Ekle</label>
                    </div>
                    <div class="option">
                        <input type="checkbox" id="edit-breaking" ${item.isBreaking ? 'checked' : ''}>
                        <label for="edit-breaking"><i class="fa-solid fa-bolt"></i> Son Dakika</label>
                    </div>
                </div>
            </div>

            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button type="button" class="btn" style="background-color: var(--border-color);" onclick="closeModal()">İptal</button>
                <button type="button" class="btn" onclick="updateNews('${item.id}')">Değişiklikleri Kaydet</button>
            </div>
        </div>
    `;

    document.getElementById("appModal").classList.add("show");
}

function updateNews(id) {
    const item = news.find(n => n.id === id);
    if(!item) return;

    item.title = document.getElementById("edit-title").value.trim();
    item.image = document.getElementById("edit-image").value.trim();
    item.summary = document.getElementById("edit-summary").value.trim();
    item.content = document.getElementById("edit-content").value.trim();
    item.date = document.getElementById("edit-date").value;
    item.source = document.getElementById("edit-source").value.trim() || "Şahin UYMAZ";
    item.isPublished = document.getElementById("edit-published").checked;
    item.isSlider = document.getElementById("edit-slider").checked;
    item.isBreaking = document.getElementById("edit-breaking").checked;

    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(news));
        showToast("Haber başarıyla güncellendi.");
        closeModal();
        renderAllNews();
        updateStats();
    } catch(e) {
        showToast("Hafıza dolu! Lütfen görsel boyutunu küçültün.", "error");
    }
}

function closeModal() {
    document.getElementById("appModal").classList.remove("show");
}

function showToast(msg, type = "success") {
    const toast = document.getElementById("toast");
    if(!toast) return;
    toast.textContent = msg;
    toast.className = `toast show ${type === 'error' ? 'error' : ''}`;
    setTimeout(() => { toast.className = "toast"; }, 3000);
}
</script>
</body>
</html>
