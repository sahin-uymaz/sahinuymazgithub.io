<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şahin Uymaz | Spor Yönetim Paneli</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    background:
        radial-gradient(circle at top left,#172554 0,#020617 42%,#000 100%);
    color:#fff;
}

.container-main{
    width:100%;
    max-width:1250px;
    margin:auto;
    padding:25px;
}

.topbar{
    background:rgba(15,23,42,.88);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:20px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
    backdrop-filter:blur(15px);
}

.brand{
    display:flex;
    align-items:center;
    gap:15px;
}

.brand-icon{
    width:52px;
    height:52px;
    border-radius:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    font-size:24px;
}

.brand h1{
    margin:0;
    font-size:21px;
    font-weight:800;
}

.brand p{
    margin:4px 0 0;
    color:#94a3b8;
    font-size:13px;
}

.back-btn{
    text-decoration:none;
    color:white;
    background:#1e293b;
    border:1px solid rgba(255,255,255,.08);
    padding:11px 16px;
    border-radius:12px;
    transition:.2s;
}

.back-btn:hover{
    background:#2563eb;
}

.grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:22px;
    margin-top:25px;
}

.panel{
    background:rgba(15,23,42,.86);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:25px;
    box-shadow:0 20px 60px rgba(0,0,0,.25);
}

.panel-title{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:18px;
    font-weight:800;
    margin-bottom:20px;
}

.panel-title i{
    color:#60a5fa;
}

.form-group{
    margin-bottom:17px;
}

.form-group label{
    display:block;
    margin-bottom:8px;
    color:#cbd5e1;
    font-size:13px;
    font-weight:700;
}

input,
select,
textarea{
    width:100%;
    border:1px solid #334155;
    outline:none;
    background:#020617;
    color:white;
    border-radius:12px;
    padding:13px 14px;
    font-size:14px;
    transition:.2s;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(59,130,246,.12);
}

textarea{
    min-height:130px;
    resize:vertical;
}

.prediction-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.prediction{
    position:relative;
}

.prediction input{
    position:absolute;
    opacity:0;
    pointer-events:none;
}

.prediction label{
    min-height:64px;
    width:100%;
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px;
    border:1px solid #334155;
    background:#020617;
    border-radius:14px;
    cursor:pointer;
    transition:.2s;
    user-select:none;
}

.prediction label:hover{
    border-color:#3b82f6;
    background:#0f172a;
}

.check-box{
    width:25px;
    height:25px;
    min-width:25px;
    border:2px solid #475569;
    border-radius:7px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:transparent;
    font-size:13px;
    transition:.2s;
}

.prediction input:checked + label{
    border-color:#22c55e;
    background:rgba(22,101,52,.18);
}

.prediction input:checked + label .check-box{
    background:#22c55e;
    border-color:#22c55e;
    color:white;
}

.prediction-text{
    font-size:13px;
    font-weight:700;
    line-height:1.3;
}

.actions{
    display:flex;
    gap:12px;
    margin-top:20px;
}

.btn{
    border:none;
    cursor:pointer;
    padding:14px 18px;
    border-radius:12px;
    color:white;
    font-weight:800;
    transition:.2s;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
}

.btn-save{
    flex:1;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
}

.btn-save:hover{
    transform:translateY(-1px);
    filter:brightness(1.1);
}

.btn-clear{
    background:#334155;
}

.btn-clear:hover{
    background:#475569;
}

.status{
    margin-top:15px;
    padding:13px;
    border-radius:12px;
    display:none;
    font-size:14px;
    font-weight:700;
}

.status.success{
    display:block;
    background:rgba(34,197,94,.12);
    border:1px solid rgba(34,197,94,.3);
    color:#86efac;
}

.status.error{
    display:block;
    background:rgba(239,68,68,.12);
    border:1px solid rgba(239,68,68,.3);
    color:#fca5a5;
}

.matches-panel{
    grid-column:1/-1;
}

.match-list{
    display:grid;
    gap:14px;
}

.match-item{
    border:1px solid #334155;
    background:#020617;
    border-radius:16px;
    padding:17px;
}

.match-top{
    display:flex;
    justify-content:space-between;
    gap:15px;
    align-items:flex-start;
}

.match-league{
    color:#60a5fa;
    font-size:12px;
    font-weight:800;
    text-transform:uppercase;
}

.match-teams{
    margin-top:7px;
    font-size:17px;
    font-weight:800;
}

.match-info{
    margin-top:7px;
    color:#94a3b8;
    font-size:12px;
}

.match-predictions{
    display:flex;
    flex-wrap:wrap;
    gap:7px;
    margin-top:13px;
}

.prediction-tag{
    background:#1e293b;
    border:1px solid #334155;
    color:#cbd5e1;
    padding:7px 9px;
    border-radius:8px;
    font-size:11px;
}

.prediction-tag.active{
    background:rgba(34,197,94,.13);
    border-color:rgba(34,197,94,.35);
    color:#86efac;
}

.match-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.small-btn{
    border:none;
    cursor:pointer;
    padding:9px 12px;
    border-radius:9px;
    color:white;
    font-weight:700;
}

.edit-btn{
    background:#2563eb;
}

.delete-btn{
    background:#dc2626;
}

.empty{
    text-align:center;
    color:#64748b;
    padding:30px;
}

.counter-box{
    margin-top:20px;
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
}

.counter{
    background:#020617;
    border:1px solid #334155;
    border-radius:14px;
    padding:15px;
    text-align:center;
}

.counter strong{
    display:block;
    font-size:25px;
    margin-bottom:4px;
}

.counter span{
    color:#94a3b8;
    font-size:11px;
}

@media(max-width:850px){

    .grid{
        grid-template-columns:1fr;
    }

    .matches-panel{
        grid-column:auto;
    }

}

@media(max-width:600px){

    .container-main{
        padding:12px;
    }

    .topbar{
        padding:16px;
    }

    .brand h1{
        font-size:17px;
    }

    .prediction-grid{
        grid-template-columns:1fr;
    }

    .counter-box{
        grid-template-columns:1fr;
    }

    .actions{
        flex-direction:column;
    }

}

</style>
</head>

<body>

<div class="container-main">

    <header class="topbar">

        <div class="brand">

            <div class="brand-icon">
                <i class="fa-solid fa-futbol"></i>
            </div>

            <div>
                <h1>ŞAHİN UYMAZ — SPOR YÖNETİMİ</h1>
                <p>Maçlar ve spor tahminleri yönetim paneli</p>
            </div>

        </div>

        <a href="spor.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Spor Sayfası
        </a>

    </header>


    <div class="grid">

        <!-- MAÇ FORMU -->

        <section class="panel">

            <div class="panel-title">
                <i class="fa-solid fa-calendar-plus"></i>
                Maç Bilgileri
            </div>

            <form id="matchForm">

                <input type="hidden" id="matchId">

                <div class="form-group">

                    <label for="league">
                        Lig / Organizasyon
                    </label>

                    <select id="league" required>

                        <option value="">Lig seçin</option>

                        <option value="Süper Lig">
                            Süper Lig
                        </option>

                        <option value="1. Lig">
                            1. Lig
                        </option>

                        <option value="Şampiyonlar Ligi">
                            Şampiyonlar Ligi
                        </option>

                        <option value="Avrupa Ligi">
                            Avrupa Ligi
                        </option>

                        <option value="Konferans Ligi">
                            Konferans Ligi
                        </option>

                        <option value="Türkiye Kupası">
                            Türkiye Kupası
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="date">
                        Tarih
                    </label>

                    <input
                        type="date"
                        id="date"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="time">
                        Saat
                    </label>

                    <input
                        type="time"
                        id="time"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="home">
                        Ev Sahibi
                    </label>

                    <input
                        type="text"
                        id="home"
                        placeholder="Örn: Fenerbahçe"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="away">
                        Deplasman
                    </label>

                    <input
                        type="text"
                        id="away"
                        placeholder="Örn: Galatasaray"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="analysis">
                        Maç Analizi
                    </label>

                    <textarea
                        id="analysis"
                        placeholder="Maç hakkında analiz ve değerlendirme yazın..."
                    ></textarea>

                </div>


                <div class="actions">

                    <button
                        type="submit"
                        class="btn btn-save"
                    >
                        <i class="fa-solid fa-floppy-disk"></i>
                        Maçı Kaydet
                    </button>

                    <button
                        type="button"
                        id="clearBtn"
                        class="btn btn-clear"
                    >
                        <i class="fa-solid fa-rotate-left"></i>
                        Temizle
                    </button>

                </div>

                <div id="status" class="status"></div>

            </form>

        </section>


        <!-- TAHMİNLER -->

        <section class="panel">

            <div class="panel-title">
                <i class="fa-solid fa-square-check"></i>
                Maç Tahminleri
            </div>

            <p style="color:#94a3b8;font-size:13px;margin-top:-8px;margin-bottom:18px;">
                Maç için gerçekleşmesini beklediğiniz tahminleri işaretleyin.
            </p>


            <div class="prediction-grid">

                <div class="prediction">

                    <input
                        type="checkbox"
                        id="p0"
                    >

                    <label for="p0">

                        <span class="check-box">
                            <i class="fa-solid fa-check"></i>
                        </span>

                        <span class="prediction-text">
                            Ev Sahibi İlk Yarı Gol
                        </span>

                    </label>

                </div>


                <div class="prediction">

                    <input
                        type="checkbox"
                        id="p1"
                    >

                    <label for="p1">

                        <span class="check-box">
                            <i class="fa-solid fa-check"></i>
                        </span>

                        <span class="prediction-text">
                            Deplasman İlk Yarı Gol
                        </span>

                    </label>

                </div>


                <div class="prediction">

                    <input
                        type="checkbox"
                        id="p2"
                    >

                    <label for="p2">

                        <span class="check-box">
                            <i class="fa-solid fa-check"></i>
                        </span>

                        <span class="prediction-text">
                            İlk Yarı Sonucu – Ev Sahibi
                        </span>

                    </label>

                </div>


                <div class="prediction">

                    <input
                        type="checkbox"
                        id="p3"
                    >

                    <label for="p3">

                        <span class="check-box">
                            <i class="fa-solid fa-check"></i>
                        </span>

                        <span class="prediction-text">
                            İlk Yarı Sonucu – Deplasman
                        </span>

                    </label>

                </div>


                <div class="prediction">

                    <input
                        type="checkbox"
                        id="p4"
                    >

                    <label for="p4">

                        <span class="check-box">
                            <i class="fa-solid fa-check"></i>
                        </span>

                        <span class="prediction-text">
                            2.5 Üst Gol
                        </span>

                    </label>

                </div>


                <div class="prediction">

                    <input
                        type="checkbox"
                        id="p5"
                    >

                    <label for="p5">

                        <span class="check-box">
                            <i class="fa-solid fa-check"></i>
                        </span>

                        <span class="prediction-text">
                            2.5 Üst + Karşılıklı Gol
                        </span>

                    </label>

                </div>


                <div class="prediction">

                    <input
                        type="checkbox"
                        id="p6"
                    >

                    <label for="p6">

                        <span class="check-box">
                            <i class="fa-solid fa-check"></i>
                        </span>

                        <span class="prediction-text">
                            Maç Sonu Ev Sahibi 1.5 Üst
                        </span>

                    </label>

                </div>


                <div class="prediction">

                    <input
                        type="checkbox"
                        id="p7"
                    >

                    <label for="p7">

                        <span class="check-box">
                            <i class="fa-solid fa-check"></i>
                        </span>

                        <span class="prediction-text">
                            Maç Sonu Deplasman 1.5 Üst
                        </span>

                    </label>

                </div>


                <div class="prediction">

                    <input
                        type="checkbox"
                        id="p8"
                    >

                    <label for="p8">

                        <span class="check-box">
                            <i class="fa-solid fa-check"></i>
                        </span>

                        <span class="prediction-text">
                            Karşılıklı Gol – VAR
                        </span>

                    </label>

                </div>

            </div>

        </section>


        <!-- KAYITLAR -->

        <section class="panel matches-panel">

            <div class="panel-title">
                <i class="fa-solid fa-list"></i>
                Kayıtlı Maçlar
            </div>


            <div class="counter-box">

                <div class="counter">
                    <strong id="totalMatches">0</strong>
                    <span>TOPLAM MAÇ</span>
                </div>

                <div class="counter">
                    <strong id="publishedMatches">0</strong>
                    <span>YAYINDA</span>
                </div>

                <div class="counter">
                    <strong id="selectedPredictions">0</strong>
                    <span>TAHMİN</span>
                </div>

            </div>


            <div
                id="matchList"
                class="match-list"
                style="margin-top:20px;"
            ></div>

        </section>

    </div>

</div>


<script>

/* =========================================================
   TEK VERİ ANAHTARI
   spor.html DE AYNI ANAHTARI KULLANACAK
========================================================= */

const STORAGE_KEY = "sahinUymazSporMaclari";


/* =========================================================
   TAHMİNLER
========================================================= */

const PREDICTIONS = [

    {
        title:"Ev Sahibi İlk Yarı Gol",
        checkedValue:"VAR"
    },

    {
        title:"Deplasman İlk Yarı Gol",
        checkedValue:"VAR"
    },

    {
        title:"İlk Yarı Sonucu – Ev Sahibi",
        checkedValue:"EV SAHİBİ"
    },

    {
        title:"İlk Yarı Sonucu – Deplasman",
        checkedValue:"DEPLASMAN"
    },

    {
        title:"2.5 Üst Gol",
        checkedValue:"VAR"
    },

    {
        title:"2.5 Üst + Karşılıklı Gol",
        checkedValue:"VAR"
    },

    {
        title:"Maç Sonu Ev Sahibi 1.5 Üst",
        checkedValue:"VAR"
    },

    {
        title:"Maç Sonu Deplasman 1.5 Üst",
        checkedValue:"VAR"
    },

    {
        title:"Karşılıklı Gol – VAR",
        checkedValue:"VAR"
    }

];


/* =========================================================
   ELEMENTLER
========================================================= */

const form = document.getElementById("matchForm");

const matchId = document.getElementById("matchId");

const league = document.getElementById("league");

const date = document.getElementById("date");

const time = document.getElementById("time");

const home = document.getElementById("home");

const away = document.getElementById("away");

const analysis = document.getElementById("analysis");

const statusBox = document.getElementById("status");

const matchList = document.getElementById("matchList");


/* =========================================================
   VERİYİ OKU
========================================================= */

function getMatches(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(STORAGE_KEY)
            );

        if(Array.isArray(data)){

            return data;

        }

    }catch(error){

        console.error(error);

    }

    return [];

}


/* =========================================================
   VERİYİ KAYDET
========================================================= */

function saveMatches(matches){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(matches)
    );

    /* Diğer sekmelerin hemen haberdar olması için */

    window.dispatchEvent(
        new StorageEvent(
            "storage",
            {
                key:STORAGE_KEY,
                newValue:JSON.stringify(matches)
            }
        )
    );

}


/* =========================================================
   ID
========================================================= */

function createId(){

    return Date.now().toString() +
        Math.random().toString(36).substring(2,8);

}


/* =========================================================
   TAHMİNLERİ OKU
========================================================= */

function readPredictions(){

    return PREDICTIONS.map(
        (prediction,index)=>{

            const checkbox =
                document.getElementById(
                    "p" + index
                );

            return {

                title:prediction.title,

                value:
                    checkbox.checked
                        ? prediction.checkedValue
                        : "—",

                selected:
                    checkbox.checked

            };

        }
    );

}


/* =========================================================
   FORM TEMİZLE
========================================================= */

function clearForm(){

    form.reset();

    matchId.value = "";

    for(let i=0;i<9;i++){

        document.getElementById(
            "p"+i
        ).checked = false;

    }

    statusBox.className = "status";

    statusBox.textContent = "";

}


/* =========================================================
   DURUM MESAJI
========================================================= */

function showStatus(message,type="success"){

    statusBox.textContent = message;

    statusBox.className =
        "status " + type;

    setTimeout(()=>{

        statusBox.className = "status";

    },3500);

}


/* =========================================================
   FORM KAYDET
========================================================= */

form.addEventListener(
    "submit",
    function(event){

        event.preventDefault();


        if(
            !league.value ||
            !date.value ||
            !time.value ||
            !home.value.trim() ||
            !away.value.trim()
        ){

            showStatus(
                "Lütfen zorunlu alanları doldurun.",
                "error"
            );

            return;

        }


        const matches = getMatches();

        const editingId = matchId.value;


        const match = {

            id:
                editingId ||
                createId(),

            league:
                league.value,

            date:
                date.value,

            time:
                time.value,

            home:
                home.value.trim(),

            away:
                away.value.trim(),

            analysis:
                analysis.value.trim(),

            predictions:
                readPredictions(),

            published:true,

            updatedAt:
                new Date().toISOString()

        };


        if(editingId){

            const index =
                matches.findIndex(
                    item =>
                        item.id === editingId
                );


            if(index !== -1){

                matches[index] = match;

            }

        }else{

            matches.unshift(match);

        }


        saveMatches(matches);

        renderMatches();

        clearForm();

        showStatus(
            "Maç başarıyla kaydedildi. Spor sayfası güncellendi."
        );

    }
);


/* =========================================================
   DÜZENLE
========================================================= */

function editMatch(id){

    const matches = getMatches();

    const match =
        matches.find(
            item => item.id === id
        );


    if(!match){

        return;

    }


    matchId.value =
        match.id || "";

    league.value =
        match.league || "";

    date.value =
        match.date || "";

    time.value =
        match.time || "";

    home.value =
        match.home || "";

    away.value =
        match.away || "";

    analysis.value =
        match.analysis || "";


    for(let i=0;i<9;i++){

        const prediction =
            match.predictions &&
            match.predictions[i];

        document.getElementById(
            "p"+i
        ).checked =
            !!(
                prediction &&
                prediction.selected
            );

    }


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


/* =========================================================
   SİL
========================================================= */

function deleteMatch(id){

    const confirmed =
        confirm(
            "Bu maçı silmek istediğinizden emin misiniz?"
        );


    if(!confirmed){

        return;

    }


    const matches =
        getMatches().filter(
            item => item.id !== id
        );


    saveMatches(matches);

    renderMatches();

    showStatus(
        "Maç silindi."
    );

}


/* =========================================================
   TARİH
========================================================= */

function formatDate(value){

    if(!value){

        return "";

    }

    const parts =
        value.split("-");

    if(parts.length !== 3){

        return value;

    }

    return (
        parts[2] +
        "." +
        parts[1] +
        "." +
        parts[0]
    );

}


/* =========================================================
   HTML GÜVENLİĞİ
========================================================= */

function escapeHtml(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


/* =========================================================
   MAÇLARI RENDER
========================================================= */

function renderMatches(){

    const matches =
        getMatches();


    document.getElementById(
        "totalMatches"
    ).textContent =
        matches.length;


    document.getElementById(
        "publishedMatches"
    ).textContent =
        matches.filter(
            match =>
                match.published !== false
        ).length;


    let predictionCount = 0;


    matches.forEach(match=>{

        if(
            Array.isArray(
                match.predictions
            )
        ){

            predictionCount +=
                match.predictions.filter(
                    prediction =>
                        prediction.selected
                ).length;

        }

    });


    document.getElementById(
        "selectedPredictions"
    ).textContent =
        predictionCount;


    if(matches.length === 0){

        matchList.innerHTML = `
            <div class="empty">
                <i class="fa-solid fa-futbol"
                   style="font-size:35px;margin-bottom:10px;">
                </i>
                <br>
                Henüz kayıtlı maç bulunmuyor.
            </div>
        `;

        return;

    }


    matchList.innerHTML =
        matches.map(match=>{

            const predictions =
                Array.isArray(
                    match.predictions
                )
                    ? match.predictions
                    : [];


            return `

                <div class="match-item">

                    <div class="match-top">

                        <div>

                            <div class="match-league">
                                ${escapeHtml(match.league)}
                            </div>

                            <div class="match-teams">
                                ${escapeHtml(match.home)}
                                <span style="color:#64748b;">vs</span>
                                ${escapeHtml(match.away)}
                            </div>

                            <div class="match-info">
                                <i class="fa-regular fa-calendar"></i>
                                ${formatDate(match.date)}
                                &nbsp;&nbsp;
                                <i class="fa-regular fa-clock"></i>
                                ${escapeHtml(match.time)}
                            </div>

                        </div>

                        <div style="color:#22c55e;font-size:12px;font-weight:800;">
                            YAYINDA
                        </div>

                    </div>


                    <div class="match-predictions">

                        ${
                            predictions
                            .filter(
                                prediction =>
                                    prediction.selected
                            )
                            .map(
                                prediction => `
                                    <span class="prediction-tag active">
                                        <i class="fa-solid fa-check"></i>
                                        ${escapeHtml(prediction.title)}
                                    </span>
                                `
                            )
                            .join("")
                        }

                        ${
                            predictions.filter(
                                prediction =>
                                    prediction.selected
                            ).length === 0
                                ? `
                                    <span class="prediction-tag">
                                        Tahmin seçilmedi
                                    </span>
                                  `
                                : ""
                        }

                    </div>


                    <div class="match-actions">

                        <button
                            class="small-btn edit-btn"
                            onclick="editMatch('${match.id}')"
                        >
                            <i class="fa-solid fa-pen"></i>
                            Düzenle
                        </button>

                        <button
                            class="small-btn delete-btn"
                            onclick="deleteMatch('${match.id}')"
                        >
                            <i class="fa-solid fa-trash"></i>
                            Sil
                        </button>

                    </div>

                </div>

            `;

        }).join("");

}


/* =========================================================
   TEMİZLE
========================================================= */

document.getElementById(
    "clearBtn"
).addEventListener(
    "click",
    clearForm
);


/* =========================================================
   BAŞLANGIÇ
========================================================= */

renderMatches();


/* =========================================================
   BAŞKA SEKMEDE DEĞİŞTİĞİNDE
========================================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key === STORAGE_KEY
        ){

            renderMatches();

        }

    }
);

</script>

</body>
</html>
