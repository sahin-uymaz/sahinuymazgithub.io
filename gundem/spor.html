<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Şahin Uymaz | Spor Yönetim</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{box-sizing:border-box}

body{
    margin:0;
    min-height:100vh;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:
    radial-gradient(circle at 10% 0%,#1e3a8a 0%,transparent 35%),
    radial-gradient(circle at 100% 100%,#312e81 0%,transparent 35%),
    #020617;
}

.page{
    width:100%;
    max-width:1200px;
    margin:auto;
    padding:25px;
}

.header{
    background:rgba(15,23,42,.88);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:20px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.brand-icon{
    width:52px;
    height:52px;
    border-radius:15px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
    font-size:23px;
}

.brand h1{
    margin:0;
    font-size:20px;
    font-weight:900;
}

.brand p{
    margin:4px 0 0;
    color:#94a3b8;
    font-size:12px;
}

.public-btn{
    color:#fff;
    text-decoration:none;
    padding:11px 15px;
    border-radius:11px;
    background:#1e293b;
    border:1px solid #334155;
    font-size:12px;
    font-weight:800;
}

.public-btn:hover{
    background:#2563eb;
}

.layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
    margin-top:22px;
}

.panel{
    background:rgba(15,23,42,.9);
    border:1px solid rgba(255,255,255,.08);
    border-radius:22px;
    padding:24px;
    box-shadow:0 20px 55px rgba(0,0,0,.25);
}

.panel.full{
    grid-column:1/-1;
}

.title{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:20px;
    font-size:18px;
    font-weight:900;
}

.title i{
    color:#60a5fa;
}

.field{
    margin-bottom:15px;
}

.field label{
    display:block;
    color:#cbd5e1;
    font-size:12px;
    font-weight:800;
    margin-bottom:7px;
}

input,select,textarea{
    width:100%;
    padding:13px;
    border-radius:11px;
    border:1px solid #334155;
    background:#020617;
    color:#fff;
    outline:none;
    font-size:14px;
}

input:focus,
select:focus,
textarea:focus{
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(59,130,246,.12);
}

textarea{
    min-height:130px;
    resize:vertical;
}

.predictions{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.prediction{
    position:relative;
}

.prediction input{
    position:absolute;
    opacity:0;
    width:1px;
    height:1px;
}

.prediction label{
    min-height:64px;
    display:flex;
    align-items:center;
    gap:11px;
    padding:12px;
    border:1px solid #334155;
    border-radius:13px;
    background:#020617;
    cursor:pointer;
    user-select:none;
    transition:.2s;
}

.prediction label:hover{
    border-color:#3b82f6;
    background:#0f172a;
}

.check{
    width:25px;
    height:25px;
    min-width:25px;
    border-radius:7px;
    border:2px solid #475569;
    display:flex;
    align-items:center;
    justify-content:center;
    color:transparent;
}

.prediction input:checked + label{
    border-color:#22c55e;
    background:rgba(34,197,94,.10);
}

.prediction input:checked + label .check{
    background:#22c55e;
    border-color:#22c55e;
    color:#fff;
}

.prediction-name{
    font-size:12px;
    line-height:1.35;
    font-weight:800;
}

.buttons{
    display:flex;
    gap:10px;
    margin-top:20px;
}

button{
    border:0;
    cursor:pointer;
    color:#fff;
    border-radius:11px;
    padding:13px 18px;
    font-weight:900;
}

.save{
    flex:1;
    background:linear-gradient(135deg,#2563eb,#4f46e5);
}

.clear{
    background:#334155;
}

button:hover{
    filter:brightness(1.12);
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:10px;
    font-size:13px;
    font-weight:800;
}

.message.show{
    display:block;
}

.success{
    background:rgba(34,197,94,.12);
    border:1px solid rgba(34,197,94,.3);
    color:#86efac;
}

.error{
    background:rgba(239,68,68,.12);
    border:1px solid rgba(239,68,68,.3);
    color:#fca5a5;
}

.match-list{
    display:grid;
    gap:12px;
}

.match{
    background:#020617;
    border:1px solid #334155;
    border-radius:15px;
    padding:16px;
}

.match-league{
    color:#60a5fa;
    font-size:11px;
    font-weight:900;
    text-transform:uppercase;
}

.match-name{
    font-size:17px;
    font-weight:900;
    margin-top:5px;
}

.match-date{
    color:#94a3b8;
    font-size:11px;
    margin-top:6px;
}

.tags{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-top:12px;
}

.tag{
    padding:6px 8px;
    border-radius:7px;
    background:rgba(34,197,94,.10);
    border:1px solid rgba(34,197,94,.25);
    color:#86efac;
    font-size:10px;
    font-weight:800;
}

.match-buttons{
    display:flex;
    gap:8px;
    margin-top:13px;
}

.edit{
    background:#2563eb;
    padding:8px 12px;
    font-size:11px;
}

.delete{
    background:#dc2626;
    padding:8px 12px;
    font-size:11px;
}

.empty{
    color:#64748b;
    text-align:center;
    padding:30px;
}

@media(max-width:800px){
    .layout{
        grid-template-columns:1fr;
    }

    .panel.full{
        grid-column:auto;
    }
}

@media(max-width:550px){
    .page{
        padding:12px;
    }

    .header{
        flex-direction:column;
        align-items:flex-start;
    }

    .predictions{
        grid-template-columns:1fr;
    }

    .buttons{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<div class="page">

<header class="header">

    <div class="brand">

        <div class="brand-icon">
            <i class="fa-solid fa-futbol"></i>
        </div>

        <div>
            <h1>ŞAHİN UYMAZ — SPOR YÖNETİM</h1>
            <p>Maç ve tahmin yönetim paneli</p>
        </div>

    </div>

    <a href="spor.html" class="public-btn">
        <i class="fa-solid fa-eye"></i>
        Spor Sayfasını Gör
    </a>

</header>


<div class="layout">

<section class="panel">

<div class="title">
    <i class="fa-solid fa-futbol"></i>
    Maç Bilgileri
</div>

<form id="matchForm">

<input type="hidden" id="editId">

<div class="field">
<label>Lig / Organizasyon</label>

<select id="league" required>
<option value="">Lig seçin</option>
<option>Süper Lig</option>
<option>1. Lig</option>
<option>Şampiyonlar Ligi</option>
<option>Avrupa Ligi</option>
<option>Konferans Ligi</option>
<option>Türkiye Kupası</option>
</select>
</div>


<div class="field">
<label>Tarih</label>
<input type="date" id="date" required>
</div>


<div class="field">
<label>Saat</label>
<input type="time" id="time" required>
</div>


<div class="field">
<label>Ev Sahibi Takım</label>
<input
type="text"
id="home"
placeholder="Örn: Fenerbahçe"
required>
</div>


<div class="field">
<label>Deplasman Takımı</label>
<input
type="text"
id="away"
placeholder="Örn: Galatasaray"
required>
</div>


<div class="field">
<label>Maç Analizi</label>
<textarea
id="analysis"
placeholder="Maç analizini buraya yazın..."></textarea>
</div>

</form>

</section>


<section class="panel">

<div class="title">
    <i class="fa-solid fa-square-check"></i>
    Tahminleri İşaretle
</div>

<p style="font-size:12px;color:#94a3b8;margin-top:-10px;margin-bottom:18px;">
    İşaretlediğin tahminler spor sayfasında yeşil tik ile gösterilir.
</p>


<div class="predictions">

<div class="prediction">
<input type="checkbox" id="p0">
<label for="p0">
<span class="check"><i class="fa-solid fa-check"></i></span>
<span class="prediction-name">Ev Sahibi İlk Yarı Gol</span>
</label>
</div>


<div class="prediction">
<input type="checkbox" id="p1">
<label for="p1">
<span class="check"><i class="fa-solid fa-check"></i></span>
<span class="prediction-name">Deplasman İlk Yarı Gol</span>
</label>
</div>


<div class="prediction">
<input type="checkbox" id="p2">
<label for="p2">
<span class="check"><i class="fa-solid fa-check"></i></span>
<span class="prediction-name">İlk Yarı Sonucu – Ev Sahibi</span>
</label>
</div>


<div class="prediction">
<input type="checkbox" id="p3">
<label for="p3">
<span class="check"><i class="fa-solid fa-check"></i></span>
<span class="prediction-name">İlk Yarı Sonucu – Deplasman</span>
</label>
</div>


<div class="prediction">
<input type="checkbox" id="p4">
<label for="p4">
<span class="check"><i class="fa-solid fa-check"></i></span>
<span class="prediction-name">2.5 Üst Gol</span>
</label>
</div>


<div class="prediction">
<input type="checkbox" id="p5">
<label for="p5">
<span class="check"><i class="fa-solid fa-check"></i></span>
<span class="prediction-name">2.5 Üst + Karşılıklı Gol</span>
</label>
</div>


<div class="prediction">
<input type="checkbox" id="p6">
<label for="p6">
<span class="check"><i class="fa-solid fa-check"></i></span>
<span class="prediction-name">Maç Sonu Ev Sahibi 1.5 Üst</span>
</label>
</div>


<div class="prediction">
<input type="checkbox" id="p7">
<label for="p7">
<span class="check"><i class="fa-solid fa-check"></i></span>
<span class="prediction-name">Maç Sonu Deplasman 1.5 Üst</span>
</label>
</div>


<div class="prediction">
<input type="checkbox" id="p8">
<label for="p8">
<span class="check"><i class="fa-solid fa-check"></i></span>
<span class="prediction-name">Karşılıklı Gol – VAR</span>
</label>
</div>

</div>


<div class="buttons">

<button
type="submit"
form="matchForm"
class="save">

<i class="fa-solid fa-floppy-disk"></i>
&nbsp; Maçı Kaydet

</button>

<button
type="button"
class="clear"
id="clearBtn">

<i class="fa-solid fa-rotate-left"></i>
&nbsp; Temizle

</button>

</div>


<div id="message" class="message"></div>

</section>


<section class="panel full">

<div class="title">
    <i class="fa-solid fa-list"></i>
    Kayıtlı Maçlar
</div>

<div id="matchList" class="match-list"></div>

</section>

</div>

</div>


<script>

const STORAGE_KEY = "sahinUymazSporMaclari";

const PREDICTIONS = [

    {
        title:"Ev Sahibi İlk Yarı Gol",
        value:"VAR"
    },

    {
        title:"Deplasman İlk Yarı Gol",
        value:"VAR"
    },

    {
        title:"İlk Yarı Sonucu – Ev Sahibi",
        value:"EV SAHİBİ"
    },

    {
        title:"İlk Yarı Sonucu – Deplasman",
        value:"DEPLASMAN"
    },

    {
        title:"2.5 Üst Gol",
        value:"VAR"
    },

    {
        title:"2.5 Üst + Karşılıklı Gol",
        value:"VAR"
    },

    {
        title:"Maç Sonu Ev Sahibi 1.5 Üst",
        value:"VAR"
    },

    {
        title:"Maç Sonu Deplasman 1.5 Üst",
        value:"VAR"
    },

    {
        title:"Karşılıklı Gol – VAR",
        value:"VAR"
    }

];


const form = document.getElementById("matchForm");

const message = document.getElementById("message");

const matchList = document.getElementById("matchList");


function getMatches(){

    try{

        const data =
            JSON.parse(
                localStorage.getItem(STORAGE_KEY)
            );

        return Array.isArray(data)
            ? data
            : [];

    }catch(error){

        return [];

    }

}


function saveMatches(matches){

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(matches)
    );

}


function createId(){

    return Date.now().toString(36) +
        Math.random()
        .toString(36)
        .substring(2);

}


function escapeHtml(value){

    return String(value || "")
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}


function getPredictions(){

    return PREDICTIONS.map(
        (prediction,index)=>{

            const checked =
                document.getElementById(
                    "p"+index
                ).checked;

            return {

                title:prediction.title,

                value:
                    checked
                        ? prediction.value
                        : "—",

                selected:checked

            };

        }
    );

}


function showMessage(text,type="success"){

    message.textContent = text;

    message.className =
        "message show " + type;

    setTimeout(()=>{

        message.className =
            "message";

    },3000);

}


function clearForm(){

    form.reset();

    document.getElementById(
        "editId"
    ).value = "";

    for(let i=0;i<9;i++){

        document.getElementById(
            "p"+i
        ).checked = false;

    }

}


form.addEventListener(
    "submit",
    function(e){

        e.preventDefault();


        const editId =
            document.getElementById(
                "editId"
            ).value;


        const match = {

            id:
                editId ||
                createId(),

            league:
                document.getElementById(
                    "league"
                ).value,

            date:
                document.getElementById(
                    "date"
                ).value,

            time:
                document.getElementById(
                    "time"
                ).value,

            home:
                document.getElementById(
                    "home"
                ).value.trim(),

            away:
                document.getElementById(
                    "away"
                ).value.trim(),

            analysis:
                document.getElementById(
                    "analysis"
                ).value.trim(),

            predictions:
                getPredictions(),

            published:true,

            updatedAt:
                new Date().toISOString()

        };


        const matches =
            getMatches();


        if(editId){

            const index =
                matches.findIndex(
                    item =>
                        item.id === editId
                );


            if(index !== -1){

                matches[index] = match;

            }

        }else{

            matches.unshift(match);

        }


        saveMatches(matches);

        renderMatches();

        clearForm();

        showMessage(
            "Maç kaydedildi. Spor sayfası güncellendi.",
            "success"
        );

    }
);


function editMatch(id){

    const match =
        getMatches().find(
            item => item.id === id
        );


    if(!match){
        return;
    }


    document.getElementById(
        "editId"
    ).value = match.id;


    document.getElementById(
        "league"
    ).value = match.league || "";


    document.getElementById(
        "date"
    ).value = match.date || "";


    document.getElementById(
        "time"
    ).value = match.time || "";


    document.getElementById(
        "home"
    ).value = match.home || "";


    document.getElementById(
        "away"
    ).value = match.away || "";


    document.getElementById(
        "analysis"
    ).value = match.analysis || "";


    for(let i=0;i<9;i++){

        const prediction =
            match.predictions?.[i];

        document.getElementById(
            "p"+i
        ).checked =
            !!prediction?.selected;

    }


    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}


function deleteMatch(id){

    if(
        !confirm(
            "Bu maçı silmek istediğinize emin misiniz?"
        )
    ){

        return;

    }


    const matches =
        getMatches().filter(
            item => item.id !== id
        );


    saveMatches(matches);

    renderMatches();

    showMessage(
        "Maç silindi.",
        "success"
    );

}


function formatDate(value){

    if(!value){
        return "";
    }

    const p =
        value.split("-");

    return p.length === 3
        ? `${p[2]}.${p[1]}.${p[0]}`
        : value;

}


function renderMatches(){

    const matches =
        getMatches();


    if(matches.length === 0){

        matchList.innerHTML = `
            <div class="empty">
                Henüz kayıtlı maç bulunmuyor.
            </div>
        `;

        return;

    }


    matchList.innerHTML =
        matches.map(match=>{

            const selected =
                (match.predictions || [])
                .filter(
                    item =>
                        item.selected
                );


            return `

            <div class="match">

                <div class="match-league">
                    ${escapeHtml(match.league)}
                </div>

                <div class="match-name">
                    ${escapeHtml(match.home)}
                    <span style="color:#64748b;"> VS </span>
                    ${escapeHtml(match.away)}
                </div>

                <div class="match-date">
                    <i class="fa-regular fa-calendar"></i>
                    ${formatDate(match.date)}
                    &nbsp;&nbsp;
                    <i class="fa-regular fa-clock"></i>
                    ${escapeHtml(match.time)}
                </div>

                <div class="tags">

                    ${
                        selected.length
                        ?
                        selected.map(
                            item=>`
                                <span class="tag">
                                    <i class="fa-solid fa-check"></i>
                                    ${escapeHtml(item.title)}
                                </span>
                            `
                        ).join("")
                        :
                        `
                            <span style="
                                color:#64748b;
                                font-size:11px;
                            ">
                                Tahmin seçilmedi
                            </span>
                        `
                    }

                </div>

                <div class="match-buttons">

                    <button
                        class="edit"
                        onclick="editMatch('${match.id}')">

                        <i class="fa-solid fa-pen"></i>
                        Düzenle

                    </button>

                    <button
                        class="delete"
                        onclick="deleteMatch('${match.id}')">

                        <i class="fa-solid fa-trash"></i>
                        Sil

                    </button>

                </div>

            </div>

            `;

        }).join("");

}


document.getElementById(
    "clearBtn"
).addEventListener(
    "click",
    clearForm
);


renderMatches();


window.addEventListener(
    "storage",
    function(e){

        if(e.key === STORAGE_KEY){

            renderMatches();

        }

    }
);

</script>

</body>
</html>
