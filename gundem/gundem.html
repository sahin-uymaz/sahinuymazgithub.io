<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Haber Portal</title>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-red: #ef4444;
            --accent-blue: #3b82f6;
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-family);
            line-height: 1.5;
            padding-bottom: 50px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        /* HEADER & BANNER */
        header {
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            padding: 15px 0;
            margin-bottom: 20px;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            color: var(--accent-red);
        }

        /* SON DAKİKA (TICKER) */
        .ticker-wrap {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            overflow: hidden;
            margin-bottom: 25px;
            height: 44px;
        }

        .ticker-title {
            background: var(--accent-red);
            color: white;
            padding: 0 15px;
            height: 100%;
            display: flex;
            align-items: center;
            font-weight: 700;
            font-size: 0.85rem;
            white-space: nowrap;
            text-transform: uppercase;
        }

        .ticker-container {
            flex-grow: 1;
            overflow: hidden;
            position: relative;
        }

        .ticker-content {
            display: inline-block;
            white-space: nowrap;
            padding-left: 100%;
            animation: ticker 35s linear infinite;
        }

        .ticker-content:hover {
            animation-play-state: paused;
        }

        @keyframes ticker {
            0% { transform: translate3d(0, 0, 0); }
            100% { transform: translate3d(-100%, 0, 0); }
        }

        /* SLIDER SECTION */
        .slider-section {
            margin-bottom: 30px;
        }

        .slider-container {
            position: relative;
            width: 100%;
            height: 420px;
            border-radius: 12px;
            overflow: hidden;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
        }

        .slide {
            position: absolute;
            inset: 0;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.6s ease-in-out, visibility 0.6s ease-in-out;
            display: flex;
            align-items: flex-end;
            pointer-events: none;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
            z-index: 1;
        }

        .slide-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            filter: brightness(0.65);
        }

        .slide-content {
            position: relative;
            z-index: 2;
            padding: 30px;
            background: linear-gradient(to top, rgba(15, 23, 42, 0.95), transparent);
            width: 100%;
            cursor: pointer;
        }

        .slide-tag {
            background: var(--accent-red);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .slide-title {
            font-size: 1.8rem;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 8px;
        }

        .slide-desc {
            font-size: 0.95rem;
            color: var(--text-muted);
            max-width: 800px;
        }

        .slider-dots {
            position: absolute;
            bottom: 15px;
            right: 20px;
            z-index: 3;
            display: flex;
            gap: 8px;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.4);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: var(--accent-red);
            width: 24px;
            border-radius: 10px;
        }

        /* GRID NEWS */
        .section-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--panel-border);
            padding-bottom: 10px;
        }

        .section-header h2 {
            font-size: 1.25rem;
            font-weight: 700;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .news-card {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .news-card:hover {
            transform: translateY(-4px);
            border-color: var(--accent-blue);
        }

        .card-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            background: #334155;
        }

        .card-body {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .card-desc {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            flex-grow: 1;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 10px;
        }

        /* MODAL */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal.show {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            width: 100%;
            max-width: 700px;
            max-height: 85vh;
            border-radius: 12px;
            overflow-y: auto;
            position: relative;
            padding: 25px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .modal-close:hover {
            background: var(--accent-red);
        }

        .modal-img {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .modal-date {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 15px;
        }

        .modal-body-text {
            font-size: 0.95rem;
            color: #cbd5e1;
            white-space: pre-wrap;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .slider-container { height: 300px; }
            .slide-title { font-size: 1.2rem; }
            .slide-desc { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <a href="#" class="logo">
                <i class="fa-solid fa-newspaper"></i>
                <span>HABER PORTALI</span>
            </a>
        </div>
    </header>

    <div class="container">
        <!-- SON DAKİKA -->
        <div class="ticker-wrap">
            <div class="ticker-title"><i class="fa-solid fa-bolt" style="margin-right: 6px;"></i> Son Dakika</div>
            <div class="ticker-container">
                <div class="ticker-content" id="breakingTicker">
                    <span>Henüz aktif son dakika haberi bulunmuyor.</span>
                </div>
            </div>
        </div>

        <!-- SLIDER -->
        <div class="slider-section">
            <div class="slider-container" id="sliderContainer">
                <div class="slide active">
                    <div class="slide-bg" style="background-image: url('https://picsum.photos/1200/500?random=1');"></div>
                    <div class="slide-content">
                        <span class="slide-tag">GÜNDEM</span>
                        <h2 class="slide-title">Sistem Yayına Hazırlandı</h2>
                        <p class="slide-desc">Yönetim panelinden eklediğiniz slider haberleri bu alanda otomatik olarak görüntülenecektir.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- YAYINDAKİ HABERLER -->
        <div class="section-header">
            <i class="fa-solid fa-layer-group" style="color: var(--accent-blue);"></i>
            <h2>Güncel Haberler</h2>
        </div>

        <div class="news-grid" id="newsGrid">
            <!-- JavaScript ile dinamik beslenecek -->
        </div>
    </div>

    <!-- HABER OKUMA MODALI -->
    <div class="modal" id="readModal">
        <div class="modal-content">
            <button class="modal-close" id="modalCloseBtn"><i class="fa-solid fa-xmark"></i></button>
            <img src="" alt="" class="modal-img" id="mImg" style="display:none;">
            <h2 class="modal-title" id="mTitle"></h2>
            <div class="modal-date" id="mDate"></div>
            <div class="modal-body-text" id="mContent"></div>
        </div>
    </div>

    <script>
        let currentSlideIndex = 0;
        let sliderInterval = null;
        let allNewsData = [];

        document.addEventListener("DOMContentLoaded", () => {
            initPortal();
            setupEventListeners();
        });

        function initPortal() {
            const localData = localStorage.getItem("newsData");
            
            if (localData) {
                try {
                    allNewsData = JSON.parse(localData);
                } catch (e) {
                    console.error("Veri okuma hatası:", e);
                    allNewsData = [];
                }
            }

            const published = allNewsData.filter(n => n.status === "published" || !n.status);

            renderBreakingNews(published);
            renderSlider(published);
            renderNewsGrid(published);
        }

        function setupEventListeners() {
            document.getElementById("modalCloseBtn").addEventListener("click", closeReadModal);

            window.addEventListener("click", (e) => {
                const modal = document.getElementById("readModal");
                if (e.target === modal) {
                    closeReadModal();
                }
            });

            window.addEventListener("keydown", (e) => {
                if (e.key === "Escape") {
                    closeReadModal();
                }
            });
        }

        /* TICKER RENDER */
        function renderBreakingNews(list) {
            const breaking = list.filter(n => n.isBreaking);
            const ticker = document.getElementById("breakingTicker");

            if (breaking.length > 0) {
                ticker.innerHTML = breaking.map(n => `
                    <span style="margin-right:40px; cursor:pointer;" data-id="${n.id}" class="ticker-item">
                        <i class="fa-solid fa-bolt" style="color:var(--accent-red); margin-right:6px;"></i>
                        <strong style="color:#fff;">${escapeHtml(n.title)}:</strong> ${escapeHtml(n.summary || '')}
                    </span>
                `).join('<span style="margin-right:40px; color:var(--panel-border);">●</span>');

                ticker.querySelectorAll('.ticker-item').forEach(el => {
                    el.addEventListener('click', () => openNewsModal(el.getAttribute('data-id')));
                });
            }
        }

        /* SLIDER RENDER & LOGIC */
        function renderSlider(list) {
            const sliderNews = list.filter(n => n.isSlider);
            const container = document.getElementById("sliderContainer");

            if (sliderNews.length === 0) return;

            container.innerHTML = "";
            
            sliderNews.forEach((item, idx) => {
                const slide = document.createElement("div");
                slide.className = `slide ${idx === 0 ? 'active' : ''}`;
                
                const imgSrc = item.imageUrl || 'https://picsum.photos/1200/500?random=' + (idx + 10);
                
                slide.innerHTML = `
                    <div class="slide-bg" style="background-image: url('${imgSrc}');"></div>
                    <div class="slide-content">
                        <span class="slide-tag">ÖNE ÇIKAN</span>
                        <h2 class="slide-title">${escapeHtml(item.title)}</h2>
                        <p class="slide-desc">${escapeHtml(item.summary || '')}</p>
                    </div>
                `;

                slide.addEventListener('click', () => openNewsModal(item.id));
                container.appendChild(slide);
            });

            if (sliderNews.length > 1) {
                const dotsWrap = document.createElement("div");
                dotsWrap.className = "slider-dots";

                sliderNews.forEach((_, idx) => {
                    const dot = document.createElement("div");
                    dot.className = `dot ${idx === 0 ? 'active' : ''}`;
                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        goToSlide(idx);
                    });
                    dotsWrap.appendChild(dot);
                });

                container.appendChild(dotsWrap);
                startSliderInterval(sliderNews.length);
            }
        }

        function startSliderInterval(count) {
            if (sliderInterval) clearInterval(sliderInterval);
            sliderInterval = setInterval(() => {
                currentSlideIndex = (currentSlideIndex + 1) % count;
                goToSlide(currentSlideIndex);
            }, 5000);
        }

        function goToSlide(index) {
            currentSlideIndex = index;
            const slides = document.querySelectorAll(".slide");
            const dots = document.querySelectorAll(".dot");

            slides.forEach((s, i) => s.classList.toggle("active", i === index));
            dots.forEach((d, i) => d.classList.toggle("active", i === index));
        }

        /* GRID RENDER */
        function renderNewsGrid(list) {
            const grid = document.getElementById("newsGrid");
            grid.innerHTML = "";

            if (list.length === 0) {
                grid.innerHTML = `<p style="color:var(--text-muted); grid-column: 1/-1; text-align:center; padding:40px 0;">Henüz eklenmiş bir haber bulunmuyor.</p>`;
                return;
            }

            list.forEach(item => {
                const card = document.createElement("div");
                card.className = "news-card";
                
                const imgSrc = item.imageUrl || 'https://picsum.photos/400/250?random=' + item.id;
                const dateStr = item.date ? new Date(item.date).toLocaleDateString("tr-TR") : 'Tarih Yok';

                card.innerHTML = `
                    <img src="${imgSrc}" class="card-img" alt="" onerror="this.src='https://picsum.photos/400/250?random=default'">
                    <div class="card-body">
                        <h3 class="card-title">${escapeHtml(item.title)}</h3>
                        <p class="card-desc">${escapeHtml(item.summary || item.content || '')}</p>
                        <div class="card-meta">
                            <span><i class="fa-regular fa-calendar" style="margin-right:4px;"></i>${dateStr}</span>
                            <span style="color:var(--accent-blue);">Oku <i class="fa-solid fa-arrow-right"></i></span>
                        </div>
                    </div>
                `;

                card.addEventListener("click", () => openNewsModal(item.id));
                grid.appendChild(card);
            });
        }

        /* MODAL ISLEMLERI */
        function openNewsModal(id) {
            const item = allNewsData.find(n => String(n.id) === String(id));
            if (!item) return;

            const modal = document.getElementById("readModal");
            const imgEl = document.getElementById("mImg");
            
            if (item.imageUrl) {
                imgEl.src = item.imageUrl;
                imgEl.style.display = "block";
            } else {
                imgEl.style.display = "none";
            }

            document.getElementById("mTitle").textContent = item.title || "";
            document.getElementById("mDate").textContent = item.date ? new Date(item.date).toLocaleString("tr-TR") : "";
            document.getElementById("mContent").textContent = item.content || item.summary || "";

            document.body.style.overflow = "hidden";
            modal.classList.add("show");
        }

        function closeReadModal() {
            const modal = document.getElementById("readModal");
            document.body.style.overflow = "auto";
            modal.classList.remove("show");
        }

        /* GUVENLIK (XSS KORUMASI) */
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
