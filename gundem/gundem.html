<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ŞAHİN UYMAZ | Gündem Haberleri</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif;}
body{background:#f8fafc;color:#0f172a;}
header{background:#081b33;color:#fff;padding:20px;text-align:center;}
header h1{font-size:24px;letter-spacing:1px;}
header p{font-size:12px;color:#94a3b8;margin-top:5px;}

.container{max-width:1100px;margin:30px auto;padding:0 20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(300px, 1fr));gap:25px;}

.card{background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 4px 15px rgba(0,0,0,0.05);border:1px solid #e2e8f0;display:flex;flex-direction:column;}
.card img{width:100%;height:200px;object-fit:cover;}
.card-body{padding:20px;display:flex;flex-direction:column;flex:1;}
.kategori{background:#d71920;color:#fff;font-size:10px;font-weight:bold;padding:4px 8px;border-radius:4px;width:max-content;margin-bottom:10px;}
.card h3{font-size:18px;margin-bottom:10px;color:#081b33;line-height:1.3;}
.card p{font-size:14px;color:#475569;line-height:1.5;flex:1;}
.tarih{font-size:11px;color:#94a3b8;margin-top:15px;}

.bos-mesaj{text-align:center;padding:50px;color:#64748b;font-size:16px;grid-column:1/-1;}
</style>
</head>
<body>

<header>
    <h1>ŞAHİN UYMAZ</h1>
    <p>HABER • GÜNDEM • YORUM • ANALİZ</p>
</header>

<div class="container">
    <div class="grid" id="haberAlani">
        <div class="bos-mesaj">Haberler yükleniyor...</div>
    </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = { databaseURL: "https://eserkon-default-rtdb.firebaseio.com" };
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

onValue(ref(db, 'kendi_haberlerim'), (snapshot) => {
    const alan = document.getElementById('haberAlani');
    alan.innerHTML = '';
    const veriler = snapshot.val();

    if(!veriler) {
        alan.innerHTML = '<div class="bos-mesaj">Henüz haber eklenmedi. Admin panelinden ilk haberinizi ekleyebilirsiniz.</div>';
        return;
    }

    Object.values(veriler).reverse().forEach(h => {
        alan.innerHTML += `
            <div class="card">
                <img src="${h.resim}" alt="haber">
                <div class="card-body">
                    <span class="kategori">${h.kategori}</span>
                    <h3>${h.baslik}</h3>
                    <p>${h.ozet}</p>
                    <div class="tarih">📅 ${h.tarih}</div>
                </div>
            </div>
        `;
    });
});
</script>

</body>
</html>
