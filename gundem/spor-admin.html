<!DOCTYPE html>

<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spor Admin Paneli</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      background: #222;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    h1 {
      margin-bottom: 25px;
      color: #00ff00;
    }

    .panel {
      background: #333;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .panel h2 {
      margin-top: 0;
      color: #00ff00;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="time"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      max-width: 500px;
      display: block;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #666;
      background: #111;
      color: #fff;
      font-size: 16px;
    }

    textarea {
      resize: vertical;
    }

    /* =========================
       TAHMİN CHECKBOXLARI
       ========================= */

    .prediction-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 20px;
    }

    .prediction-item {
      position: relative;
    }

    .prediction-item input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .prediction-item label {
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 55px;
      padding: 12px;
      border: 2px solid #666;
      border-radius: 8px;
      background: #222;
      color: #fff;
      cursor: pointer;
      user-select: none;
      transition: 0.2s ease;
    }

    .prediction-item label:hover {
      border-color: #00ff00;
    }

    .prediction-item input[type="checkbox"]:checked + label {
      background: #064d06;
      border-color: #00ff00;
      color: #00ff00;
      box-shadow: 0 0 10px rgba(0,255,0,0.25);
    }

    .prediction-item input[type="checkbox"]:checked + label::before {
      content: "✓";
      margin-right: 8px;
      font-size: 20px;
      font-weight: bold;
    }

    .button-area {
      margin-top: 25px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 12px 25px;
      background: #00ff00;
      color: #000;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
    }

    button:hover {
      background: #00cc00;
    }

    button.secondary {
      background: #555;
      color: #fff;
    }

    button.secondary:hover {
      background: #666;
    }

    #sonuc {
      margin-top: 20px;
      padding: 15px;
      border-radius: 8px;
      background: #111;
      display: none;
    }

    .selected-info {
      margin-top: 20px;
      padding: 15px;
      background: #111;
      border-radius: 8px;
      color: #ccc;
    }

    .selected-info strong {
      color: #00ff00;
    }

    @media (max-width: 700px) {
      .prediction-list {
        grid-template-columns: 1fr;
      }

      body {
        padding: 10px;
      }

      .panel {
        padding: 15px;
      }
    }
  </style>

</head>

<body>

<div class="container">

  <h1>⚽ Spor Admin Paneli</h1>

  <!-- MAÇ BİLGİLERİ -->

  <div class="panel">

```
<h2>Maç Bilgileri</h2>

  </div>

  <!-- TAHMİNLER -->

  <div class="panel">

```

  </div>

  <!-- BUTONLAR -->

  <div class="panel">

```
<div class="button-area">

  <button type="button" id="kaydetBtn">
    💾 Kaydet
  </button>

  <button
    type="button"
    class="secondary"
    id="temizleBtn"
  >
    🗑️ Temizle
  </button>

</div>

<div id="sonuc"></div>
```

  </div>

</div>

<script>

  /*
   * ==========================================
   * CHECKBOX SİSTEMİ
   * ==========================================
   */

  const checkboxlar = document.querySelectorAll(
    '.prediction-item input[type="checkbox"]'
  );

  const secilenler = document.getElementById("secilenler");


  function secimleriGuncelle() {

    const secilen = [];

    checkboxlar.forEach(function(checkbox) {

      if (checkbox.checked) {
        secilen.push(checkbox.value);
      }

    });

    if (secilen.length === 0) {

      secilenler.textContent =
        "Henüz seçim yapılmadı.";

    } else {

      secilenler.textContent =
        secilen.join(" • ");

    }
  }


  checkboxlar.forEach(function(checkbox) {

    checkbox.addEventListener("change", function() {

      secimleriGuncelle();

    });

  });


  /*
   * ==========================================
   * KAYDET
   * ==========================================
   */

  document
    .getElementById("kaydetBtn")
    .addEventListener("click", function() {

      const tahminler = {};

      checkboxlar.forEach(function(checkbox) {

        tahminler[checkbox.id] = checkbox.checked;

      });


      const mac = {

        tarih:
          document.getElementById("tarih").value,

        evSahibi:
          document.getElementById("evSahibi").value,

        deplasman:
          document.getElementById("deplasman").value,

        saat:
          document.getElementById("saat").value,

        aciklama:
          document.getElementById("aciklama").value,

        tahminler:
          tahminler

      };


      localStorage.setItem(
        "sporMac",
        JSON.stringify(mac)
      );


      const sonuc =
        document.getElementById("sonuc");

      sonuc.style.display = "block";

      sonuc.innerHTML =
        "✅ Maç ve tahminler başarıyla kaydedildi.";


      console.log("Kaydedilen maç:", mac);

    });


  /*
   * ==========================================
   * TEMİZLE
   * ==========================================
   */

  document
    .getElementById("temizleBtn")
    .addEventListener("click", function() {

      document.getElementById("tarih").value = "";

      document.getElementById("evSahibi").value = "";

      document.getElementById("deplasman").value = "";

      document.getElementById("saat").value = "";

      document.getElementById("aciklama").value = "";


      checkboxlar.forEach(function(checkbox) {

        checkbox.checked = false;

      });


      secimleriGuncelle();


      document.getElementById("sonuc").style.display =
        "none";

    });


  /*
   * ==========================================
   * DAHA ÖNCE KAYDEDİLEN VERİYİ YÜKLE
   * ==========================================
   */

  window.addEventListener("DOMContentLoaded", function() {

    const kayit =
      localStorage.getItem("sporMac");

    if (!kayit) {
      return;
    }


    try {

      const mac = JSON.parse(kayit);


      if (mac.tarih) {
        document.getElementById("tarih").value =
          mac.tarih;
      }

      if (mac.evSahibi) {
        document.getElementById("evSahibi").value =
          mac.evSahibi;
      }

      if (mac.deplasman) {
        document.getElementById("deplasman").value =
          mac.deplasman;
      }

      if (mac.saat) {
        document.getElementById("saat").value =
          mac.saat;
      }

      if (mac.aciklama) {
        document.getElementById("aciklama").value =
          mac.aciklama;
      }


      if (mac.tahminler) {

        checkboxlar.forEach(function(checkbox) {

          checkbox.checked =
            mac.tahminler[checkbox.id] === true;

        });

      }


      secimleriGuncelle();

    }

    catch (error) {

      console.error(
        "Kayıt okunamadı:",
        error
      );

    }

  });

</script>

</body>
</html>
