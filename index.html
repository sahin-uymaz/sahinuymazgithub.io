  <!-- FontAwesome İkon Kütüphanesi -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* CSS Değişkenleri */
    :root {
      --lacivert: #0f172a;
    }

    /* =====================================================
       FOOTER
    ===================================================== */
    footer {
      background: var(--lacivert);
      color: white;
      padding: 45px 24px;
    }

    .footer-inner {
      max-width: 1280px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 30px;
    }

    footer h3 {
      margin-top: 0;
    }

    footer p,
    footer li {
      color: #cbd5e1;
      line-height: 1.7;
    }

    footer ul {
      list-style: none;
      padding: 0;
    }

    footer a {
      color: #cbd5e1;
      text-decoration: none;
      transition: .2s;
    }

    footer a:hover {
      color: #facc15;
    }

    .footer-bottom {
      max-width: 1280px;
      margin: 30px auto 0;
      border-top: 1px solid rgba(255, 255, 255, .15);
      padding-top: 18px;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
    }

    /* =====================================================
       MOBİL RESPONSIVE
    ===================================================== */
    @media (max-width: 900px) {
      .main-nav { display: none; }
      .hero { height: auto; min-height: 500px; }
      .hero h2 { font-size: 36px; }
      .area-grid { grid-template-columns: repeat(2, 1fr); }
      .research-grid { grid-template-columns: 1fr; }
      .process-grid { grid-template-columns: repeat(2, 1fr); }
      .footer-inner { grid-template-columns: 1fr; }
    }

    @media (max-width: 600px) {
      .header-inner { justify-content: center; }
      .logo-text { text-align: center; }
      .logo-text .isim-alani { justify-content: center; }
      .hero h2 { font-size: 28px; }
      .hero p { font-size: 15px; }
      .section { padding: 40px 15px; }
      .area-grid,
      .process-grid,
      .approach-grid { grid-template-columns: 1fr; }
      .visit-card { width: 100%; }
      .support-panel {
        right: 10px;
        bottom: 80px;
        width: calc(100vw - 20px);
        height: 480px;
      }
      .support-launcher {
        right: 12px;
        bottom: 12px;
      }
    }

    /* =====================================================
       HAREKET AZALTMA (ACCESSIBILITY)
    ===================================================== */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<!-- =====================================================
     CANLI DESTEK SCRIPT
===================================================== -->
<script>
function toggleSupportPanel() {
  const panel = document.getElementById('supportPanel');
  if (panel) {
    panel.classList.toggle('open');
  }
}

function handleChatSubmit(event) {
  event.preventDefault();
  const input = document.getElementById('chatInput');
  const chatArea = document.getElementById('chatArea');
  const typing = document.getElementById('typingIndicator');
  const text = input.value.trim();

  if (!text) return;

  const userMsg = document.createElement('div');
  userMsg.className = 'message user';
  userMsg.textContent = text;
  chatArea.insertBefore(userMsg, typing);
  
  input.value = '';
  chatArea.scrollTop = chatArea.scrollHeight;

  typing.classList.add('show');
  chatArea.scrollTop = chatArea.scrollHeight;

  setTimeout(() => {
    typing.classList.remove('show');
    const agentMsg = document.createElement('div');
    agentMsg.className = 'message agent';
    agentMsg.textContent = "Mesajınız alınmıştır. İncelemelerimiz ve raporlarımız doğrultusunda tarafınıza en kısa sürede bilgilendirme yapılacaktır.";
    chatArea.insertBefore(agentMsg, typing);
    chatArea.scrollTop = chatArea.scrollHeight;
  }, 1200);
}

// Güvenli Yönlendirme Kontrolü
document.addEventListener("DOMContentLoaded", function () {
  const urlParams = new URLSearchParams(window.location.search);
  const isApprovedByMail = urlParams.get('access') === 'granted';
  const hasSessionAccess = sessionStorage.getItem('site_access_approved');

  if (isApprovedByMail || hasSessionAccess) {
    sessionStorage.setItem('site_access_approved', 'true');
  } else {
    // Erişim yetkisi yoksa giriş paneline yönlendirir
    window.location.href = "/giris-formlari/giris-paneli.html";
  }
});
</script>
